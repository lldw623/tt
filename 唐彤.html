<title>外卖双层选择转盘</title>
<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}
body{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  min-height:100vh;
  background:#f4f4f4;
  font-family:"Microsoft YaHei",sans-serif;
  padding:20px;
}
.wrap{
  position:relative;
  width:min(90vw,420px);
  height:min(90vw,420px);
  margin-bottom:30px;
}
.pointer{
  position:absolute;
  top:-5px;
  left:50%;
  transform:translateX(-50%);
  width:0;
  height:0;
  border-left:18px solid transparent;
  border-right:18px solid transparent;
  border-top:28px solid #e63946;
  z-index:9;
}
#wheel{
  width:100%;
  height:100%;
  border-radius:50%;
  box-shadow:0 0 14px #00000022;
  transition: all 4s cubic-bezier(0.17,0.67,0.12,0.99);
}
#btn{
  padding:14px 40px;
  border:none;
  border-radius:10px;
  background:#ff6700;
  color:#fff;
  font-size:18px;
  cursor:pointer;
}
#btn:disabled{
  background:#888;
  cursor:not-allowed;
}
#result{
  margin-top:24px;
  font-size:22px;
  font-weight:bold;
  text-align:center;
}
#tip{
  margin-bottom:16px;
  font-size:18px;
}
</style>
</head>

 const canvas = document.getElementById('wheel');
 const ctx = canvas.getContext('2d');
 const btn = document.getElementById('btn');
 const resultDom = document.getElementById('result');
 const tipDom = document.getElementById('tip');
 let currentList = JSON.parse(JSON.stringify(categoryData));
 let stage = 1; // 1大类，2菜品
 let totalAngle = 0;
 // 绘制转盘
 function drawWheel(list){
   const count = list.length;
   const perAngle = Math.PI * 2 / count;
   ctx.clearRect(0,0,420,420);
   for(let i=0;i<count;i++){
     const start = i * perAngle;
     ctx.beginPath();
     ctx.moveTo(210,210);
     ctx.arc(210,210,200,start,start+perAngle);
     ctx.fillStyle = list[i].color;
     ctx.fill();
     ctx.save();
     ctx.translate(210,210);
     ctx.rotate(start + perAngle/2);
     ctx.fillStyle="#fff";
     ctx.font="bold 13px Microsoft YaHei";
     ctx.textAlign="center";
     ctx.fillText(list[i].name,130,5);
     ctx.restore();
   }
 }
 // 生成随机颜色（菜品轮用）
 function getRandomColor(){
   const arr = ['#ff4757','#2f3542','#2ed573','#1e90ff','#ffa502','#ff6b81','#70a1ff','#7bed9f'];
   return arr[Math.floor(Math.random()*arr.length)];
 }
 btn.onclick = async function(){
   btn.disabled = true;
   resultDom.innerText = "";
   const count = currentList.length;
   const perAngle = 360 / count;
   const randomRound = 5 + Math.floor(Math.random()*6);
   const randomIndex = Math.floor(Math.random()*count);
   const targetRotate = totalAngle + randomRound * 360 + (randomIndex * perAngle);
   totalAngle = targetRotate;
   canvas.style.transform = `rotate(${targetRotate}deg)`;
   await new Promise(resolve=>setTimeout(resolve,4000));
   const selectedItem = currentList[randomIndex];
   if(stage ===1){
     // 第一轮结束，切换菜品轮
     tipDom.innerText = `选中大类：${selectedItem.name} → 第二轮挑选菜品`;
     const foodArr = foodMap[selectedItem.name].map(name=>{
       return {name:name,color:getRandomColor()};
     })
     currentList = foodArr;
     stage =2;
     drawWheel(currentList);
     totalAngle = 0;
   }else{
     resultDom.innerText = `✅最终选择：${selectedItem.name}`;
   }
   btn.disabled = false;
 }
 // 初始化绘制大类转盘
 drawWheel(currentList);
 </script>
